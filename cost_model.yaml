    name: "F2 determinism (4 arms) + gateway-side F3 + F3-10 + F7"
    live: true
    days: 2
    days_rationale: >
      F3-10 is expected to amend §7.1: whether a reader can reconstruct a confusion
      matrix from LOG_ONLY telemetry alone is the experiment, and if they cannot, §7.1
      prescribes an impossible workflow. F2's n=300 per arm is dealt as 2 x 150; the
      pooled arm keeps n=300 and its 95% power against a 1% flip rate, and a cross-day
      pair that disagrees falsifies "deterministic function of the score" just as an
      intra-day pair would — arguably more strongly, since it also excludes a
      within-session cache.
    amends: ["S7.1", "S6.4"]
    items:
