      F3 and F5-6 are the DC-2 family, expected to amend §3.2 (prompt-attack tags).
      Corpus items within a category are exchangeable, so the pre-registered corpus is
      dealt across two days: recall is pooled at the full n and each day yields its own
      arm for the day-effect screen. No extra calls.
    amends: ["S3.2", "S7.1"]
    items:
      - price: guardrail_text_unit
        qty: 4200
        note: >
          Corpus totals from corpora/MANIFEST.json: content_filter 5x120 = 600,
          prompt_attack 3x120 = 360, benign 110, hard_negatives 60, multilingual
          7x60 = 420, plus the 4-arm F5-6 design (4 x 120 = 480) and threshold sweeps
          at 6 lattice points over the 600 content-filter items. Rounded up.
      - price: guardrail_pii_text_unit
        qty: 367
        note: "PII corpus: 341 positives + 26 negatives"
      - price: guardrail_checks_content_text_unit
        qty: 1100
        note: >
          The InvokeGuardrailChecks half of the same corpora. F5-6/DC-2 needs both APIs
          on the same inputs, and the Pricing API confirms they are metered separately,
          so they must be costed separately.
      - price: guardrail_checks_prompt_attack_text_unit
        qty: 840
        note: "prompt_attack 360 + hard_negatives 60 + benign 110 through promptAttack, x2 days-split arms"
    projected_usd: null      # computed
    actual_usd: null          # NOT MEASURABLE per phase -- see meta.attribution and actuals:
    status: pending

  - id: "2"
    name: "build the testbed 01_iam -> 09_traces; end-to-end benign call; assert traces"
    live: true
    days: 1
    days_rationale: >
      Produces no claim about the document — it builds the instrument. Nothing here
      can amend, so the rule does not bind.
    items:
