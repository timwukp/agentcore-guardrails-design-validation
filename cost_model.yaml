      verified -- it is a coincidence, and the next edit to the quantity would have had
      no anchor.

  logs_insights_gb_scanned:
    usd: 0.005
    unit: "1 GB scanned by a Logs Insights query"
    source: "Pricing API, AmazonCloudWatch USE1-DataScanned-Bytes: $0.005 per GB"
    pricing_api:
      service_code: AmazonCloudWatch
      usagetype: USE1-DataScanned-Bytes
    verified: true

  logs_storage_gb_month:
    usd: 0.03
    unit: "1 GB-month of log storage"
    source: "Pricing API, AmazonCloudWatch USE1-TimedStorage-ByteHrs: $0.03 per GB-mo"
    pricing_api:
      service_code: AmazonCloudWatch
      usagetype: USE1-TimedStorage-ByteHrs
    verified: true
    note: >
      Absent from my first model entirely. Small (~4.2 GB of spans for one month =
      $0.13) but it is a real charge that outlives the experiment, and Phase 8's +30d
      regression means the logs are deliberately retained rather than swept at teardown.

  ebs_gp3_gb_month:
    usd: 0.08
    unit: "1 GB-month of gp3 volume, us-east-1"
    source: "Pricing API, AmazonEC2 EBS:VolumeUsage.gp3: $0.08 per GB-mo"
    pricing_api:
      service_code: AmazonEC2
      usagetype: EBS:VolumeUsage.gp3
    verified: true
    note: >
      Added 2026-09-21, and it is the only price in this file that the METER verified
      before the Pricing API did. `actuals.ledger`'s `EBS:VolumeUsage.gp3` entry needs it
      to check its own arithmetic, and the account-wide gp3 line steps by $0.103226/day on
      the day the runner's volume was created, which is 40 x 0.08 / 31 to six decimals --
      the size and the price falling out of one measurement together. Absent from the
      projection entirely, which is why the projection missed $4.09: a volume that
      outlives its instance is exactly the charge a per-phase model cannot see, because it
      belongs to no phase.

  control_plane_call:
    usd: 0.0
    unit: "1 control-plane API call (Create/Get/Update/List/Delete)"
    source: >
      AgentCore control-plane calls are not separately metered: no Create*/Get*/Update*/
      List*/Delete* usagetype appears under AmazonBedrock or AmazonBedrockAgentCore in
      the Pricing API. Asserted, not guessed -- and a zero has no lookup to make.
    verified: true

# ---------------------------------------------------------------------------
# Phases. `days` is the number of distinct calendar days of observation the phase
# needs, and it is DERIVED from `amends`, not chosen: see replication_rule below.
# ---------------------------------------------------------------------------
replication_rule:
  binds: >
    A phase needs observations on >= 2 separate calendar days if and only if a claim it
    produces may AMEND the document under test. Sealed as
    validity_checks.reproduction_before_amendment; enforced by
    check_amendment_readiness.py.
  confirm_only_is_exempt: >
    A phase whose result can only CONFIRM the document does not amend it, so the rule
    does not bind. If such a phase unexpectedly falsifies, it acquires the requirement
    at that moment and its day-2 run is funded from `contingency_usd`, not from the
    baseline. This keeps the projection honest in both directions: the baseline is not
    padded for replications that the expected outcome does not require, and a surprise
    does not silently blow the ceiling.
  split_not_double: >
    For a phase whose n counts REPEATED TRIALS of one condition (latency, determinism)
    or EXCHANGEABLE CORPUS ITEMS (detection), the pre-registered n is DEALT ACROSS the
    two days rather than run twice. The pooled estimator keeps the pre-registered n, so
    the primary analysis is unchanged and the marginal cost of replication is zero;
    what the split buys is a between-day comparison the single-day design could not
    make at any n. Doubling would be the right answer only if the second day had to
    re-estimate the quantity, and it does not — it has to test the quantity's
    durability, which is a different and cheaper question.
  day_effect_protocol: >
    Pre-specified before data, so it is not a post-hoc knob. Test day 1 vs day 2
    (Mann-Whitney U for latency, Fisher exact for proportions) at alpha = 0.01, the
    same level as the pre-registered cold-start contamination check. p >= 0.01: pool
    and report the pooled estimate. p < 0.01: do NOT pool; report per-day estimates and
    amend the document with a RANGE plus an explicit "varies between observation days"
    caveat. A day effect is a finding about the service, not a defect in the harness.
  power_of_the_split: >
    Stated as a limitation, not hidden: a between-day comparison at n/2 per day is a
    SCREEN, not a powered test. At 2 x 500 latency trials it detects a shift in the
    median of roughly 0.2 sigma; a 5% recall shift at 2 x 60 corpus items it will
    usually miss. The split therefore excludes a GROSS transient (an outage, a
    throttled window, a mid-deploy service state), which is what the rule exists for,
    and does not license a claim that the two days are statistically indistinguishable.

