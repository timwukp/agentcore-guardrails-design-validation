  - id: "3"
    name: "F1 config surface (incl. F1-3 permit trap) + F4 truth table"
    live: true
    days: 2
    days_rationale: >
      F1-3 amends §3.1 (the validationMode omission, DC-1) and F1-1's SDK floor amends
      §4.1/§7.1. F5-7a is the precedent that an API-surface observation can change
      under us: five dated snapshots said one thing and the live page now says another.
      Control-plane calls are unmetered, so the second day is free.
    amends: ["S3.1", "S4.1", "S7.1", "S7.2", "S8"]
    items:
      - price: control_plane_call
        qty: 1200
      - price: lambda_invoke
        qty: 1440
        note: >
          STRICT UPPER BOUND on F4's gateway tool calls, counted by ARM rather than by
          hypothesis. The sealed confirmatory_e_cell note says "8 cells x 120 = 960
          calls"; that figure counts one ORACLE cell per hypothesis, which is the right
          unit for a power calculation and the wrong unit for a cost line, because six of
          the eight cells carry a mutation, a pairing or a control arm that also costs
          calls. F4's arms: F4-1 120 (ENFORCE, no permit) + 120 mutation (baseline permit
          added); F4-2 120 LOG_ONLY + 120 paired ENFORCE; F4-3 the full 2x2 at 4 x 120 =
          480; F4-4 120; F4-5 120 (permit+forbid) + 120 permit-only control; F4-6 120
          denials captured in full. 240+240+480+120+240+120 = 1440.

          It is an UPPER bound and not an estimate because a policy-denied request never
          reaches the target: the gateway answers it, so the Lambda is not invoked. On the
          document's own predictions only the allowing arms invoke it — F4-1's mutation
          (120), F4-2's LOG_ONLY (120), three of F4-3's four cells (360) and F4-5's control
          (120) = 720, exactly half. Costing at 1440 prices the case where the document is
          WRONG about every blocking arm, which is the conservative direction and the one
          this project exists to test for. The previous 600 was neither bound nor estimate;
          it under-counted the oracle cells alone by 120.
      - price: lambda_gb_second
        qty: 18.0
        note: >
          1440 invocations x 128 MB x 100 ms = 1440 x 0.0125 GB-s. Derived from the
          invocation count above by the same arithmetic that produced the previous 7.5
          from 600, so the two lines cannot drift apart silently.
      - price: guardrail_text_unit
        qty: 400
