      Most F5 cases can only CONFIRM §4.4 and are exempt. F5-4a and F5-4b are not:
      their outcome is unknown by construction (does evaluation DENY or ALLOW when it
      cannot run?), and §3.3 BP#4 currently records that AWS does not document this, so
