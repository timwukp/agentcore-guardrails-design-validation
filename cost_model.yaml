# Machine-readable cost model. COST.md is GENERATED from this file by
# estimate_cost.py — do not type figures into the report by hand.
#
# Why this file exists: the approved plan specifies an `estimate_cost.py` that "refuses
# to run if the projection exceeds the pre-registered ceiling", but no ceiling was ever
# written anywhere a program could read. The figure lived only in the plan's prose
# ($55–95) and in my recollection of it. Per feedback_prose_is_not_verified a number in
# a sentence is unverified, so the control the plan describes could not exist. It exists
# now, and the ceiling below is the plan's own figure, hoisted.
#
# estimate_cost.py refuses to authorise a live phase while any price that phase depends
# on carries `verified: false`. An unverified price is a guess, and a projection built
# from guesses that reports "within ceiling" is the vacuous-check pattern applied to
# money: it passes by construction. All nine priced lines were read from the live Pricing
# API on 2026-08-09 and now carry `verified: true`; `--verify-prices` re-reads them and
# exits non-zero on any drift, printing recorded-vs-live rather than silently editing
# this file.

meta:
  version: 1
  created: 2026-08-09
  currency: USD
  ceiling_usd: 95           # the approved plan's upper figure, now machine-readable
  ceiling_source: >
    ~/.claude/plans/melodic-hatching-seal.md, Part 7: "Cost disclosure: $55–95
    projected (default path + 5c + 6b)". The upper end is the ceiling; the lower end is
    not a target.
  attribution: >
    CORRECTED 2026-09-21, by measurement. This field used to read: "Actuals are read by
    resource tag Project=guardrails-doc-validation, never by service. This account carries
    roughly $27k/mo of unrelated spend." Three of those four claims are wrong, and the
    method it describes returns $0 with no error. (1) The `Project` tag key is INACTIVE in
    Billing -- of 261 user-defined keys exactly one is Active -- so the filter it names
    matches nothing; the positive control against the active key returns $23,477.99 in the
    same log. (2) This project uses TWO tag values, `guardrails-doc-validation` on 29
    resources and `grx-validation` on 2, so no single value ever saw both halves. (3) The
    account carries $47,629.88 for August 2026, not $27k -- the qualifier was
    unquantified prose that went stale (feedback_quantify_qualifiers). What survives is the
    fourth claim: a service-level filter WOULD misattribute other systems' cost, and the
    measured size of that error is now on the record -- TWICE, because the obvious
    replacement for a broken tag is a rule keyed on days, and there are two such rules that
    fail in opposite directions. Claim a whole line if ANY of its spend lands on a project
    day: $70,905.69 over 1,154 lines, 5,303x the truth on the 2026-09-21T15:51:30Z reading (this
    one GROWS between readings, because the shared lines it sweeps in keep billing daily, and it is
    recomputed on every run rather than trusted from here), because this account's biggest lines are
    storage and request traffic billed every single day, so every project day intersects them. Claim a line only if ALL of its spend is on project days: $11.70 over 105 lines --
    BELOW the ledger, and it loses the expensive part, because it cannot see a shared line at
    all. The orphaned 40 GB volume, the single most valuable thing this measurement found, is
    invisible to it. No rule keyed on days alone can work here, which is why every ledger line
    below carries a named basis instead. Both numbers are recomputed on every run so this
    paragraph cannot go stale the way the $27k one did. Actuals are read per
    (SERVICE, USAGE TYPE) pair -- keyed on the pair because 159 usage-type names in this
    window appear under more than one service, `DataTransfer-Out-Bytes` under ten of them, and
    a census keyed on the name alone silently sums unrelated services. Checked by
    tools/read_actual_spend.py against 1,309 pairs over 51 days. Per-PHASE actuals are not
    obtainable at all: Cost Explorer's finest retroactive granularity is a calendar day and
    this project ran several phases per day, so every phase carries actual_usd: null.

# ---------------------------------------------------------------------------
# Unit prices. `verified: false` blocks live phases that depend on the price.
#
# Every non-zero price carries a `pricing_api` block naming the exact service code and
# usagetype `estimate_cost.py --verify-prices` queries. Without it "verified" could only
# mean "some number was fetched", and a lookup aimed at the wrong usagetype is worse
# than no lookup because it stamps a guess as confirmed.
#
# All figures below were READ FROM THE LIVE PRICING API on 2026-08-09, us-east-1. Four
# of my five initial guesses were wrong, one of them by 5x -- see the `was_guessed` notes.
# ---------------------------------------------------------------------------
prices:
  guardrail_text_unit:
    usd: 0.00015
    unit: "1 text unit (<= 1000 characters) through ApplyGuardrail content filters"
    source: "Pricing API, USE1-Guardrail-ContentPolicyUnitsConsumed: $0.15 per 1K text units"
    pricing_api:
      service_code: AmazonBedrock
      usagetype: USE1-Guardrail-ContentPolicyUnitsConsumed
    verified: true
    was_guessed: >
      I had written 0.00075 from memory of the pricing page -- FIVE TIMES the real
      figure. It would have inflated Phase 6 from $1.25 to $6.24 in guardrail units and
      the whole projection by roughly $13, i.e. a "cost disclosure" that misreported the
      dominant line item by 5x while looking precise to five decimal places. This is
      feedback_prose_is_not_verified about money: the number lived in a YAML string and
      no check re-derived it.

  guardrail_checks_content_text_unit:
    usd: 0.00007
    unit: "1 text unit through InvokeGuardrailChecks contentFilter"
    source: "Pricing API, USE1-GuardrailChecks-ContentFilterCheckUnitsConsumed"
    pricing_api:
      service_code: AmazonBedrock
      usagetype: USE1-GuardrailChecks-ContentFilterCheckUnitsConsumed
    verified: true
    finding: >
      A SEPARATE AND CHEAPER BILLING FAMILY. `GuardrailChecks-*` usagetypes exist
      alongside `Guardrail-*` and cost less than half as much ($0.00007 vs $0.00015).
      This is direct billing-side evidence that InvokeGuardrailChecks and ApplyGuardrail
      are distinct evaluation paths, not two front doors to one engine -- which is
      exactly the distinction F5-6/DC-2 was designed to test behaviourally, and the one
      §3.2 blurs. AWS meters them separately. Recorded as a free F10 observation.

  guardrail_checks_prompt_attack_text_unit:
    usd: 0.00008
    unit: "1 text unit through InvokeGuardrailChecks promptAttack"
    source: "Pricing API, USE1-GuardrailChecks-PromptAttackCheckUnitsConsumed"
    pricing_api:
      service_code: AmazonBedrock
      usagetype: USE1-GuardrailChecks-PromptAttackCheckUnitsConsumed
    verified: true

  guardrail_pii_text_unit:
    usd: 0.00010
    unit: "1 text unit through ApplyGuardrail sensitive-information filters (paid tier)"
    source: "Pricing API, USE1-Guardrail-SensitiveInformationPolicyPaidUnitsConsumed"
    pricing_api:
      service_code: AmazonBedrock
      usagetype: USE1-Guardrail-SensitiveInformationPolicyPaidUnitsConsumed
    verified: true
    note: >
      The only guess that was right. There is also a FREE tier usagetype
      (SensitiveInformationPolicyFreeUnitsConsumed, $0), so the PII line is an upper
      bound: if our 31 entity types fall in the free tier the actual will be lower.
      Costing at the paid rate is the conservative direction.

  lambda_invoke:
    usd: 0.0000002
    unit: "1 Lambda request — the deterministic echo target"
    source: "Pricing API, AWSLambda usagetype Request: $0.0000002 per request"
    pricing_api:
      service_code: AWSLambda
      usagetype: Request
    verified: true

  lambda_gb_second:
    usd: 0.0000133334
    unit: "1 GB-second of Lambda compute (cheapest tier)"
    source: "Pricing API, AWSLambda Lambda-GB-Second, Tier-3"
    pricing_api:
      service_code: AWSLambda
      usagetype: Lambda-GB-Second
      tier_description: cheapest
    verified: true
    note: >
      Three tiers are returned ($0.0000166667 / $0.000015 / $0.0000133334). We take the
      cheapest because this account's existing ~$27k/mo of Lambda usage has long since
      pushed it past the tier-1 volume boundary. The line is negligible either way
      (128MB x 100ms x 20k invocations = 250 GB-s = $0.003), and it is now a line rather
      than an unstated omission.

  spans_ingest_gb:
    usd: 0.50
    unit: "1 GB of custom log data ingested (Standard log class) — the aws/spans path"
    source: "Pricing API, AmazonCloudWatch DataProcessing-Bytes: $0.50 per GB"
    pricing_api:
      service_code: AmazonCloudWatch
      usagetype: DataProcessing-Bytes
    verified: true
    was_guessed: >
      The figure 0.50 was right but the usagetype I had assumed
      ("USE1-Application-Signals-TransactionSearch-Bytes") RETURNS NO PRODUCTS. Spans
      land in `aws/spans` as ingested log data (DataProcessing-Bytes), and the only
