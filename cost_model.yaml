# ---------------------------------------------------------------------------
# Contingency: named, bounded, and attributable — not a slush figure.
# ---------------------------------------------------------------------------
contingency:
  - id: "6b-replication"
    usd: 5.0
    trigger: "Phase 6b falsifies §4.5's egress requirement, acquiring the 2-day rule"
  - id: "5c-replication"
    usd: 1.0
    trigger: >
      Phase 5c falsifies §4.4 non-bypassability. Funded, but a second exposure
      requires an explicit decision on blast radius, not just budget.
  - id: "6-day-effect"
    usd: 15.0
    trigger: >
      Phase 6's day-effect test rejects at alpha=0.01, so the two nights cannot be
      pooled and a third night is needed to tell a trend from two-point noise.
  - id: "retry-tail"
    usd: 8.0
    trigger: >
      Throttling forces retries beyond the 3-attempt backoff, re-running trials. Sized
      at roughly 20% of the metered phases.

# ---------------------------------------------------------------------------
# ACTUALS — what the meter says this project spent, and on whose authority.
#
# Read on 2026-09-21 from Cost Explorer, DAILY granularity, grouped by SERVICE and
# USAGE_TYPE over the whole account: 1,309 (service, usage type) pairs across 51 days —
# 51 and not 52 because Cost Explorer's newest complete day was 09-20, and days after it
# are ABSENT from the answer rather than zero. Checked by
# `tools/read_actual_spend.py`, which re-reads the meter and fails on any disagreement
# with the figures below. It never writes this file — a number changing here is a
# decision a person makes, printed side by side, the same rule `--verify-prices` follows.
#
# WHY THIS IS A LEDGER AND NOT A TAG FILTER
# The method this file used to state ("read by resource tag Project=…, never by service")
# cannot work, and each of its three failures was measured rather than argued:
#   * the `Project` tag key is INACTIVE in Billing. Of 261 user-defined keys in this
#     account exactly one is Active (`tums-project`). A Cost Explorer query filtered on
#     an inactive key returns $0 with no error — the positive control is in the same log:
#     the identical query against the active key returns $23,477.99. A $0 here was a
#     claim about the query, not about the spend (`feedback_empty_query_is_not_zero`).
#   * this project uses TWO tag values — 29 resources carry
#     `Project=guardrails-doc-validation` and 2 carry `Project=grx-validation` — so no
#     single filter value ever saw both halves.
#   * Cost Explorer's finest retroactive granularity is a calendar DAY and this project
#     ran several phases per day. Per-phase actuals are therefore not recoverable at all;
#     hourly and resource-level data would have had to be enabled before the spend and
#     retains 14 days. That is why every phase below carries `actual_usd: null`.
#
# WHY NOT JUST "DAYS WHEN THE PROJECT RAN"
# Both versions of that rule were implemented and measured, and they fail in OPPOSITE
# directions, which is the part a single number would have hidden:
#   * generous ("any spend on a project day claims the whole line") — $70,905.69 over 1,154
#     lines, 5,303x the truth on the 2026-09-21T15:51:30Z reading. This account's largest lines
#     are shared storage and request traffic billed every day, so every project day intersects
#     every one of them — which is also why this number GROWS on every re-read (it was
#     $70,040.35 / 5,238x thirty-four minutes earlier). It is recomputed on every run; the stamp
#     is here so the figure can be checked against the reading it came from rather than read as
#     a constant (feedback_perishable_claim_cannot_be_checked).
#   * strict ("only if all of the line's spend is on project days") — $11.70 over 105 lines,
#     which is BELOW the $13.37 ledger. It errs by omission and drops exactly the expensive
#     lines: the EBS volume and both Polly lines have spend from before this project began,
#     and the EC2 instance has spend on three days no artifact backs. The orphaned 40 GB
#     volume — the most valuable thing this measurement found — is invisible to it.
# `read_actual_spend.py` recomputes both on every run, so this paragraph cannot go stale
# the way the "$27k/mo" qualifier did, and neither can it be read as "be more careful with
# the day list": no rule keyed on days alone works here.
#
# WHY THE CENSUS IS KEYED ON (SERVICE, USAGE TYPE) AND NOT ON THE NAME
# Because usage-type names are not unique. In this window 159 names appear under more than
# one service; `DataTransfer-Out-Bytes` appears under ten, and `TimedStorage-ByteHrs` under
# S3, ECR and DynamoDB at once. The first version of the reader keyed on the name alone and
# would have summed unrelated services into one line and reconciled a ledger entry against
# the wrong total. Every entry below therefore names its `service`, and the checker refuses
# an entry whose (service, usage type) pair the meter does not have.
#
# THE THREE BASES, in descending strength:
#   quantity_match  the meter's quantity equals a quantity this project counted for
#                   itself, from its own logs, at the time. Two meters agreeing.
#   resource_match  a step in a shared account-wide line whose size and dollar rate both
#                   match one identified resource this project created.
#   day_set         the usage type exists only because of this project's own probes, and
#                   its metered days fall inside the project's own days. The weakest, and
#                   the only one that needs `excluded_days` to stay honest.
# ---------------------------------------------------------------------------
actuals:
  read_at: "2026-09-21T15:51:30Z"
  read_at_note: >
    CORRECTED, twice, and the second correction is the point. This field first read
    "2026-09-21T21:49Z", which was local time on a UTC+8 machine wearing a Z: the reading it described
    finished at 14:58:15Z, so the published stamp sat seven hours in the FUTURE. It survived because
    the only rule was "is it blank", and an impossible stamp is not blank. Two fixes, in the order that
    matters: `read_actual_spend.py --save-census` now PRODUCES the value (`utc_stamp`, clock-injected
    and covered by arms) and writes it into the census file beside the lines it describes, and
    `estimate_cost.py` refuses a stamp that does not parse as UTC or that sits after the clock. The
    first attempt at this field was then re-typed as "2026-09-21T15:32:19Z" — correct UTC, but derived
    by a human reading `date -u`, which is the same class of authorship the fix was supposed to
    remove, and the census it named had been written BEFORE the field existed and so could not carry
    it. The value above is instead copied from the artifact that produced it:
    evidence/cost/census-20260921T155109Z.json carries `read_at: 2026-09-21T15:51:30Z` in its own
    body, and `read_actual_spend.py` prints a disagreement between the two on every run rather than
    trusting either (feedback_mandatory_field_timing, feedback_two_readers_one_format).
