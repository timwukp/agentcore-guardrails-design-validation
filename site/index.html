<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <!-- One static title, in English, replaced by `LocaleProvider` once a language is chosen. This is
         the title of the document as served, before any JavaScript knows which language the reader
         wants; it is deliberately the repository name, which is the same string in both. -->
    <title>agentcore-guardrails-design-validation</title>
    <!-- A RELATIVE href, like every other asset URL here, because `vite.config.ts` sets `base: "./"` so
         one bundle serves both the CloudFront root and a `v/<stamp>/` prefix. `/favicon.svg` would 404
         under the prefix — and a favicon 404 is not cosmetic here: it was the only console error on the
         landing route, and a console with one expected error in it is a console nobody reads.
         SVG only, no `.ico` fallback: the browsers that need one cannot run this SPA either. It is a
         FILE rather than a `data:` URI because the CSP served by `site-stack.ts` is `img-src 'self'`,
         and widening that for an icon would widen it for everything. -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  </head>
  <body>
    <div id="root">
      <noscript lang="en">
        This dashboard renders derived JSON in the browser and needs JavaScript. The same numbers are
        in the repository as markdown and JSON, which is the citable form.
        <p lang="zh-TW">
          本儀表板在瀏覽器中算繪推導出來的 JSON，需要 JavaScript。同樣的數字以 markdown 與 JSON
          的形式存在版本庫裡，那才是可引用的形式。
        </p>
      </noscript>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
