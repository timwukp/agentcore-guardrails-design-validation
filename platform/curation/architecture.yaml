note: >
  Topology and justifications authored here. Every colour, badge, chip and count on the rendered
  diagrams is derived at build time from results/_census.json, results/phase1/ and
  results/CITATION-POLICY.md; the layout coordinates are computed, not authored, and asserted to be
  crossing-free by a test rather than by eye.
