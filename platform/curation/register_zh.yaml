# The deficiency register in Chinese — the half `FUTURE-WORK.md` cannot yield.
#
# WHY THIS FILE EXISTS
#
# `registers.json` is derived from `FUTURE-WORK.md`, which is written in English, and its item titles
# and tier headings render on `/register` in BOTH locales. So a zh-TW reader has been reading 46
# sentences of this platform's own voice in a language they did not choose, under a banner that says
# the English on this site is quoted evidence — which these are not. They are ours.
#
# `build_site_data.authored(en, zh)` already exists for exactly this and its comment names the
# measurement: "the census at platform/census/ measures how many rendered authored strings are still
# bare strings; that count is the backlog, and it is the one this shape is here to drive to zero."
# The register was the largest single producer left in it.
#
# WHY IT IS A CURATION FILE AND NOT A SECOND COLUMN IN `FUTURE-WORK.md`
#
# Same reason as `architecture.yaml` and `practices.yaml`: the document is parsed, and a document that
# has to carry its own translation in a shape the parser understands is a document whose format is now
# a schema. `FUTURE-WORK.md` stays prose. This file carries only what the prose cannot yield, keyed by
# the number the document itself assigns.
#
# WHY EVERY ITEM IS MANDATORY, STARTING NOW
#
# `derive_registers()` DIES if any item number or tier heading here has no translation. That is
# deliberate and it is the only moment it is free: a field is mandatory for nothing once a writer
# exists who did not fill it in (feedback_mandatory_field_timing). All 41 items are translated in the
# commit that adds this file, so the next future-work item cannot land untranslated — which is exactly
# how the last five got in, and how the ceiling came to be exceeded rather than lowered.
#
# WHAT A TRANSLATION HERE MAY NOT DO
#
# It may not soften. Several of these titles are this project convicting itself, and a translation
# that reads as a caveat where the English reads as a defect is a second register. Terms with a
# meaning inside this repository — the case ids, `run_id`, TRUE/FALSE/INCONCLUSIVE, tier numbers — stay
# as they are, because they are identifiers, not words.

tiers:
  "Tier 1 — the paper is wrong or self-contradictory until these are fixed":
    "第 1 級 —— 在這些修好之前,論文是錯的,或者自相矛盾"
  "Tier 2 — structural gaps that make the paper unreviewable as science":
    "第 2 級 —— 使這篇論文無法以科學標準受審的結構性缺口"
  "Tier 3 — measurement debt":
    "第 3 級 —— 量測債"
  "Tier 4 — engineering debt that weakens the evidence chain":
    "第 4 級 —— 削弱證據鏈的工程債"
  "Tier 5 — citation hygiene, before anything is published":
    "第 5 級 —— 發表任何東西之前的引用衛生"

